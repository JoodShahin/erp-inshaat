name: ERP Local Startup Check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: erp-local-startup
  cancel-in-progress: false

jobs:
  startup:
    name: Build and verify server startup
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    defaults:
      run:
        shell: cmd
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build
        run: npm run build
      - name: Verify server startup with isolated local database
        run: node scripts/ci-local-startup-smoke.mjs
